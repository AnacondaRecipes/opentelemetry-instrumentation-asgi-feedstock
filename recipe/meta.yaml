{% set name = "opentelemetry-instrumentation-asgi" %}
{% set version = "0.66b1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/opentelemetry_instrumentation_asgi-{{ version }}.tar.gz
  sha256: 78cdc5e45e897e16a8dac9d282e8d5bdf9af2d58e1313fa0bdd4a134c6f9dafc

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - asgiref >=3.0,<4
    - opentelemetry-api >=1.12,<2
    - opentelemetry-instrumentation =={{ version }}
    - opentelemetry-semantic-conventions =={{ version }}
    - opentelemetry-util-http =={{ version }}

# tests/test_asgi_middleware.py and tests/test_asgi_custom_headers.py require opentelemetry-test-utils,
# which is not in the main channel yet; only tests/test_getter.py is runnable.
test:
  source_files:
    - tests
  imports:
    - opentelemetry
    - opentelemetry.instrumentation.asgi
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -vv tests/test_getter.py

about:
  home: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-asgi
  dev_url: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/v0.66b1/instrumentation/opentelemetry-instrumentation-asgi
  doc_url: https://opentelemetry.io/docs/
  summary: ASGI instrumentation for OpenTelemetry
  description: |
    OpenTelemetry instrumentation for ASGI applications. Wraps an ASGI
    callable to automatically generate spans for incoming requests,
    propagate trace context, and emit standard HTTP semantic-convention
    attributes. Used by other instrumentation plugins (e.g. FastAPI) and
    can be applied directly to any ASGI framework.
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mariusvniekerk
    - rxm7706
